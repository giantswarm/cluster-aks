global:
  release:
    version: v34.4.0

  metadata:
    name: test-wc-overlay-acns
    organization: giantswarm
    servicePriority: lowest

  connectivity:
    baseDomain: azuretest.gigantic.io
    network:
      dnsServiceIP: 172.31.0.10
      pods:
        cidrBlocks:
          - 100.64.0.0/16
      services:
        cidrBlocks:
          - 172.31.0.0/16
      vnet:
        subnetArmId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/existing-network-rg/providers/Microsoft.Network/virtualNetworks/existing-vnet/subnets/existing-subnet

  controlPlane:
    networking:
      networkPluginMode: overlay
      outboundType: userDefinedRouting
      advancedNetworking:
        enabled: true
        observability:
          enabled: true
        security:
          enabled: true
          advancedNetworkPolicies: L7

  providerSpecific:
    location: westeurope
    subscriptionId: 00000000-0000-0000-0000-000000000000
    asoAuthenticationSecretName: test-wc-overlay-acns-aso-creds

cluster:
  internal:
    ephemeralConfiguration:
      offlineTesting:
        renderWithoutReleaseResource: true
