{{/* AKS-specific security-bundle Helm values*/}}
{{/* https://github.com/giantswarm/security-bundle/blob/main/helm/security-bundle/values.yaml*/}}
{{- define "AKSSecurityBundleHelmValues" }}
userConfig:
  kyverno:
    configMap:
      values:
        kyverno:
          admissionController:
            tolerations:
            - key: "node.cluster.x-k8s.io/uninitialized"
              operator: "Exists"
              effect: "NoSchedule"

# Only BYO CNI clusters have a `cilium` HelmRelease to wait for, otherwise AKS manages Cilium itself
apps:
  cloudnativePG:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  falco:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  kubescape:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  kyverno:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  kyvernoPolicyOperator:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  trivyOperator:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}
{{- end }}
