{{/* AKS-specific security-bundle Helm values*/}}
{{/* https://github.com/giantswarm/security-bundle/blob/main/helm/security-bundle/values.yaml*/}}
{{- define "AKSSecurityBundleHelmValues" }}
userConfig:
  kyverno:
    configMap:
      values:
        kyverno:
          admissionController:
            tolerations:
            - key: "node.cluster.x-k8s.io/uninitialized"
              operator: "Exists"
              effect: "NoSchedule"

apps:
  cloudNativePG:
    dependsOn:
      - prometheus-operator-crd

  falco:
    dependsOn:
      {{- if $.Values.global.connectivity.cni.managed }}
      - cilium
      {{- end }}
      - kyverno-crds

  kubescape:
    dependsOn:
      {{- if $.Values.global.connectivity.cni.managed }}
      - cilium
      {{- end }}
      - kyverno-crds
      - kyverno-policy-operator

  kyverno:
    dependsOn:
      {{- if $.Values.global.connectivity.cni.managed }}
      - cilium
      {{- end }}
      - kyverno-crds
      - prometheus-operator-crd
      - alloy-podlogs-crds

  kyvernoPolicyOperator:
    dependsOn:
      {{- if $.Values.global.connectivity.cni.managed }}
      - cilium
      {{- end }}
      - kyverno-crds
      - kyverno
      - alloy-podlogs-crds

  trivyOperator:
    dependsOn:
      {{- if $.Values.global.connectivity.cni.managed }}
      - cilium
      {{- end }}
      - kyverno-crds
      - trivy
{{- end }}
