{{/* AKS-specific observability-bundle Helm values*/}}
{{- define "AKSObservabilityBundleHelmValues" }}
userConfig:
  kubePrometheusStack:
    configMap:
      values:
        kube-prometheus-stack:
          coreDns:
            service:
              selector:
                # AKS-managed CoreDNS pods are labeled `k8s-app: kube-dns` instead of `k8s-app: coredns`
                k8s-app: kube-dns
          prometheusOperator:
            admissionWebhooks:
              mutatingWebhookConfiguration:
                annotations:
                  # prevent AKS from overriding the VPA webhook configuration
                  admissions.enforcer/disabled: "true"

# Only BYO CNI clusters have a `cilium` HelmRelease to wait for, otherwise AKS manages Cilium itself
apps:
  alloyEvents:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}
  alloyLogs:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}
  alloyMetrics:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}

  kubePrometheusStack:
    dependsOn:
      cilium: {{ $.Values.global.connectivity.cni.managed }}
{{- end }}
