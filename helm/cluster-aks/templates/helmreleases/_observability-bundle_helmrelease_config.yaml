{{/* AKS-specific observability-bundle Helm values*/}}
{{- define "AKSObservabilityBundleHelmValues" }}
userConfig:
  kubePrometheusStack:
    configMap:
      values:
        kube-prometheus-stack:
          coreDns:
            service:
              selector:
                # AKS-managed CoreDNS pods are labeled `k8s-app: kube-dns` instead of `k8s-app: coredns`
                k8s-app: kube-dns
          prometheusOperator:
            admissionWebhooks:
              mutatingWebhookConfiguration:
                annotations:
                  # prevent AKS from overriding the VPA webhook configuration
                  admissions.enforcer/disabled: "true"

# AKS manages Cilium itself, so there is no `cilium` HelmRelease to wait for
apps:
  alloyEvents:
    dependsOn:
      cilium: false
  alloyLogs:
    dependsOn:
      cilium: false
  alloyMetrics:
    dependsOn:
      cilium: false

  kubePrometheusStack:
    dependsOn:
      cilium: false
{{- end }}
