{{/* Azure-specific cert-manager Helm values*/}}
{{/* https://github.com/giantswarm/cert-manager-app/blob/main/helm/cert-manager/values.yaml*/}}
{{- define "AKSCertManagerHelmValues" }}
ciliumNetworkPolicy:
  enabled: true

giantSwarmClusterIssuer:
  acme:
    http01:
        enabled: false
    dns01:
      azureDNS:
        enabled: true
        zoneName: '{{ .Values.global.metadata.name }}.{{ .Values.global.connectivity.baseDomain }}'
        resourceGroupName: '{{ include "cluster-aks.resourceGroup.name" $ }}'
        subscriptionID: '{{ .Values.global.providerSpecific.subscriptionId }}'
        # The client ID is injected by the values generated by the WorkloadIdentity resource
        # in the cert-manager-crossplane-resources HelmRelease.
        # identityClientID:

cert-manager:
  webhook:
    mutatingWebhookConfigurationAnnotations:
      # prevent AKS from overriding the VPA webhook configuration
      admissions.enforcer/disabled: "true"

  {{/*
    Setting up Azure Managed Identity
    We do this ourselves to avoid having external-dns depend on a webhook.
    It also requires data from a ConfigMap that is deployed by the WorkloadIdentity resource
    in the cert-manager-crossplane-resources HelmRelease.
  */}}
  extraEnv:
    - name: AZURE_FEDERATED_TOKEN_FILE
      value: /var/run/secrets/azure/tokens/azure-identity
    - name: AZURE_AUTHORITY_HOST
      value: https://login.microsoftonline.com/
    - name: AZURE_CLIENT_ID
      valueFrom:
        configMapKeyRef:
          key: clientID
          name: cert-manager-identity
    - name: AZURE_TENANT_ID
      valueFrom:
        configMapKeyRef:
          key: tenantID
          name: cert-manager-identity
  volumes:
    - name: azure-identity-token
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              audience: api://AzureADTokenExchange
              expirationSeconds: 3600
              path: azure-identity
  volumeMounts:
    - mountPath: /var/run/secrets/azure/tokens
      name: azure-identity-token
      readOnly: true
{{- end }}
